# XcodeGen project definition. This file is the source of truth for the Xcode
# project. Fajso.xcodeproj is generated in CI and never committed.
name: Fajso
options:
  bundleIdPrefix: com.sohaib
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Fajso.xcconfig
  Release: Config/Fajso.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.26.1
targets:
  Fajso:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Fajso
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.sohaib.fajso
            CFBundleURLSchemes: [fajso]
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: Fajso shares how far apart you and your partner are.
        NSLocationAlwaysAndWhenInUseUsageDescription: Allow "Always" so your distance stays up to date on your partner's Lock Screen, even when Fajso is closed.
        NSCameraUsageDescription: Take a photo to send to your partner's widget.
        NSPhotoLibraryUsageDescription: Choose a photo to send to your partner's widget.
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
        FAJSO_APP_GROUP: $(FAJSO_APP_GROUP)
    entitlements:
      path: App/Fajso.entitlements
      properties:
        com.apple.security.application-groups: [group.com.sohaib.fajso]
    dependencies:
      - target: FajsoWidgets
        embed: true
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sohaib.fajso
  FajsoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: Core/DesignSystem
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Fajso Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
        FAJSO_APP_GROUP: $(FAJSO_APP_GROUP)
    entitlements:
      path: Widgets/FajsoWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.sohaib.fajso]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sohaib.fajso.widgets
        SKIP_INSTALL: YES
schemes:
  Fajso:
    build:
      targets:
        Fajso: all
        FajsoWidgets: all
