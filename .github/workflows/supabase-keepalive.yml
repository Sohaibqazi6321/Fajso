name: Supabase keep-alive

# Free Supabase projects pause after about a week without activity. One tiny
# database read a day keeps Fajso's backend awake. RLS returns no rows to an
# anonymous caller, which is fine: the request is what counts.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Query the database
        run: |
          HOST=$(sed -n 's/^SUPABASE_HOST = //p' Config/Fajso.xcconfig)
          KEY=$(sed -n 's/^SUPABASE_PUBLISHABLE_KEY = //p' Config/Fajso.xcconfig)
          curl --fail --silent --show-error \
            -H "apikey: $KEY" \
            "https://$HOST/rest/v1/profiles?select=id&limit=1"
