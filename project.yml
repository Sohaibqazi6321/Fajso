name: Together
options:
  bundleIdPrefix: com.sohaib
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.26.1
targets:
  Together:
    type: application
    platform: iOS
    sources:
      - path: ios/Together
        excludes:
          - Info.plist
          - Together.entitlements
      - path: ios/Shared
    dependencies:
      - target: TogetherWidgets
        embed: true
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sohaib.together
        INFOPLIST_FILE: ios/Together/Info.plist
        CODE_SIGN_ENTITLEMENTS: ios/Together/Together.entitlements
        TOGETHER_DEVELOPER_USER_ID: E18A0AD5-048B-4B53-A363-5E9FF1832B86
  TogetherWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/TogetherWidgets
        excludes:
          - Info.plist
          - TogetherWidgets.entitlements
      - path: ios/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sohaib.together.widgets
        INFOPLIST_FILE: ios/TogetherWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: ios/TogetherWidgets/TogetherWidgets.entitlements
        SKIP_INSTALL: YES
