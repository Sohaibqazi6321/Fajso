name: iOS build (IPA for sideloading)

# macOS minutes cost 10x on private repos (~200 free per month), so this
# only runs when started by hand or when a v* tag is pushed.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build Fajso.ipa
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project Fajso.xcodeproj \
            -scheme Fajso \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | tee xcodebuild.log

      # An unsigned build carries no entitlements, so sideloading tools never
      # learn that the app and widget share an App Group. Ad-hoc signing with
      # the entitlements embeds them; Sideloadly/AltStore read them when they
      # re-sign with a free Apple ID.
      - name: Embed entitlements (ad-hoc signature)
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Fajso.app"
          APPEX="$APP/PlugIns/FajsoWidgets.appex"
          test -d "$APP" || { echo "Fajso.app not found"; exit 1; }
          test -d "$APPEX" || { echo "FajsoWidgets.appex not embedded"; exit 1; }
          codesign --force --sign - --entitlements Widgets/FajsoWidgets.entitlements "$APPEX"
          codesign --force --sign - --entitlements App/Fajso.entitlements "$APP"
          echo "App entitlements:"; codesign -d --entitlements - "$APP"
          echo "Widget entitlements:"; codesign -d --entitlements - "$APPEX"

      - name: Package IPA
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Fajso.app"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/Fajso.app
          (cd build/ipa && zip -qry ../../Fajso.ipa Payload)
          ls -lh Fajso.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Fajso-ipa
          path: Fajso.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Fajso-build-log
          path: xcodebuild.log
          if-no-files-found: warn
